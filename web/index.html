<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Whiteboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="board">
  <div id="paper"></div>
  <canvas id="base"></canvas>
  <canvas id="live"></canvas>
  <canvas id="fx" hidden></canvas>
  <textarea id="textEdit" rows="1" maxlength="500" spellcheck="false" autocapitalize="sentences" aria-label="Text annotation" hidden></textarea>
</div>

<div id="bar" role="toolbar" aria-label="Whiteboard tools">
  <span id="swatches" class="tools"></span>
  <button type="button" id="eraser" class="tools" aria-label="Eraser" aria-pressed="false">Erase</button>
  <button type="button" id="textBtn" class="tools" aria-label="Text annotation" aria-pressed="false">Text</button>
  <span class="sep tools"></span>
  <button type="button" class="tools" data-w="0.002" aria-label="Small pen" aria-pressed="false">S</button>
  <button type="button" class="tools on" data-w="0.004" aria-label="Medium pen" aria-pressed="true">M</button>
  <button type="button" class="tools" data-w="0.009" aria-label="Large pen" aria-pressed="false">L</button>
  <span class="sep tools"></span>
  <button type="button" id="undo" class="tools wide" aria-label="Undo my last stroke">Undo</button>
  <button type="button" id="crumpleBtn" class="tools wide" aria-label="Crumple this board: wipe it and put it on the shelf">Crumple</button>
  <button type="button" id="shelfBtn" class="tools wide" aria-label="Shelf of crumpled boards" aria-expanded="false" aria-controls="shelfPanel">Shelf</button>
  <span class="sep tools"></span>
  <button type="button" id="moveBtn" class="tools wide" aria-label="Move around the board: drag to pan" aria-pressed="false">Move</button>
  <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
  <button type="button" id="zoomReset" class="wide" aria-label="Reset zoom to the whole board">100%</button>
  <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
  <span class="sep"></span>
  <button type="button" id="layersBtn" class="wide" aria-label="Layers" aria-expanded="false" aria-controls="layersPanel">Layers</button>
  <button type="button" id="shareBtn" class="wide" aria-label="Share links" aria-expanded="false" aria-controls="sharePanel">Share</button>
</div>

<section id="layersPanel" class="panel" aria-label="Layers" hidden>
  <header>
    <h2>Layers</h2>
    <button type="button" class="close" data-close aria-label="Close layers">Close</button>
  </header>
  <p class="hint">Hide changes only your view. Delete removes a layer for everyone and can be restored.</p>
  <ul id="layerList"></ul>
</section>

<section id="shelfPanel" class="panel" aria-label="Shelf" hidden>
  <header>
    <h2>Shelf</h2>
    <button type="button" class="close" data-close aria-label="Close shelf">Close</button>
  </header>
  <p class="hint" id="shelfHint"></p>
  <ul id="shelfList"></ul>
</section>

<section id="sharePanel" class="panel" aria-label="Share" hidden>
  <header>
    <h2>Share</h2>
    <button type="button" class="close" data-close aria-label="Close share">Close</button>
  </header>
  <div class="link" id="editRow">
    <label for="editLink">Edit link (anyone with it can draw)</label>
    <div class="row">
      <input id="editLink" type="text" readonly spellcheck="false">
      <button type="button" data-copy="editLink" aria-label="Copy edit link">Copy</button>
    </div>
  </div>
  <div class="link" id="viewRow">
    <label for="viewLink">View-only link</label>
    <div class="row">
      <input id="viewLink" type="text" readonly spellcheck="false">
      <button type="button" data-copy="viewLink" aria-label="Copy view-only link">Copy</button>
    </div>
  </div>
  <p><a id="newBoard" href="/" target="_blank" rel="noopener">New board</a></p>
</section>

<div id="nav" aria-label="Where you are on the board. Tap or drag to move." hidden><div id="navBox"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="msg" role="alert" hidden></div>
<div id="status"><b></b><span>connecting</span></div>

<script src="/app.js" defer></script>
</body>
</html>
