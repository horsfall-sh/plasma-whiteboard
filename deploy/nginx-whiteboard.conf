# nginx site for whiteboard.example.com on the Oracle Linux 9 FIPS host.
#
# Two stages, installed as two files on the host:
#
#   Stage 1 (live now):        /etc/nginx/conf.d/whiteboard.conf
#       port 80 only: serves the ACME HTTP-01 challenge, redirects the rest.
#   Stage 2 (after the cert):  /etc/nginx/conf.d/whiteboard-tls.conf
#       port 443: TLS and reverse proxy to the relay on 127.0.0.1:8787.
#       Kept on the host as /etc/nginx/whiteboard-tls.conf.staged until
#       /root/issue-cert.sh has obtained a certificate and copies it in.
#
# Both stages are below, separated by the "STAGE 2" marker. The host's
# /etc/nginx/nginx.conf is replaced by a minimal one (see HOST.md) that has
# access_log off at http level and a catch-all default server returning 444.

# ===================== STAGE 1: /etc/nginx/conf.d/whiteboard.conf ==========

server {
    listen 80;
    listen [::]:80;
    server_name whiteboard.example.com;

    # The board key is in the URL path: never log request URIs.
    access_log off;
    # Upstream errors at "error" level include the request line; keep only crit.
    error_log /var/log/nginx/whiteboard.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===================== STAGE 2: /etc/nginx/conf.d/whiteboard-tls.conf ======

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whiteboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/whiteboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whiteboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Follow the system crypto policy (FIPS): OpenSSL picks the allowed suites.
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:wbtls:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/whiteboard.error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    proxy_http_version 1.1;

    # proxy_set_header is NOT inherited into a location that sets any of its
    # own, so each location repeats the full set.
    location = /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # Overwrite, never append: the relay trusts the last X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # Overwrite, never append: the relay trusts the last X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
